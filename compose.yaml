services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://qa_lab:qa_lab_password@db:5432/qa_lab
      LAB_DELAY_MIN_MS: ${LAB_DELAY_MIN_MS:-300}
      LAB_DELAY_MAX_MS: ${LAB_DELAY_MAX_MS:-3200}
      LAB_RESET_KEY: ${LAB_RESET_KEY:-local-lab-reset}
      LAB_USERNAME: ${LAB_USERNAME:-admin@azurian.com}
      LAB_PASSWORD: ${LAB_PASSWORD:-Azurian2026!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_lab
      POSTGRES_USER: qa_lab
      POSTGRES_PASSWORD: qa_lab_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_lab -d qa_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qa_lab_data:/var/lib/postgresql/data

volumes:
  qa_lab_data:
