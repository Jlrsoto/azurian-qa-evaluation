services:
  azurian-qa-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azurian-qa-portal-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/documents || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
